[project]
name = "stock-ai"
version = "0.1.0"
description = "AI-driven stock screening, backtesting, and trading system for JP/US markets."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "hayashida" }]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "rich>=13.7",
]

# Heavy, phase-scoped dependencies are opt-in extras so the base install
# stays small and fast. Install a phase's deps with e.g. `uv sync --extra data`.
[project.optional-dependencies]
data = [
    "pandas>=2.2",
    "numpy>=1.26",
    "httpx>=0.27",
    "yfinance>=0.2.40",
    "openpyxl>=3.1",
]
db = ["sqlalchemy>=2.0", "alembic>=1.13"]
ai = ["anthropic>=0.30", "openai>=1.30", "google-generativeai>=0.7"]
backtest = ["vectorbt>=0.26"]
dashboard = ["streamlit>=1.36"]
# 'daily' without --once blocks and fires once a day; this is what it blocks on.
# It was imported and never declared, which only surfaced when the environment
# was cleaned: a fresh install could reach 'No module named schedule' at the
# moment it was asked to start running unattended.
scheduler = ["schedule>=1.2"]
broker = ["ib-insync>=0.9.86"]
# 立花証券・ｅ支店・ＡＰＩ。仮想ＵＲＬがRSA公開鍵で暗号化されて返るため復号が要る。
# cryptography は現状ほかの依存が引き込んでいて import は通るが、それを当てにしない。
# 同じことを `schedule` でやって、環境を掃除した瞬間に落ちた前例がある。
tachibana = ["cryptography>=42.0", "httpx>=0.27"]
# moomoo's client talks to a local OpenD gateway rather than to a web API, so
# it is only useful on a machine where OpenD is installed and logged in. It is
# still listed in the 'runtime' group below rather than left as an extra-only
# install: see the note there for why an extra does not survive here.
moomoo = ["moomoo-api>=10.10"]

[project.scripts]
stock-ai = "stock_ai.cli:main"

[dependency-groups]
# Everything the CLI, dashboard and AI commands import at runtime, expressed as
# a self-reference to the extras above so the versions are declared once.
#
# It exists because `uv run` syncs the environment to the project's *default*
# requirements before running anything, and an extra is not a default:
# `uv sync --extra ai` lasts only until the next `uv run`, which prunes it.
# Observed live, mid-verification - "No module named 'anthropic'" on a machine
# where the same command had worked minutes earlier and nothing but a git pull
# had happened in between. A group listed in `default-groups` is maintained
# rather than pruned, so the environment stops decaying under normal use.
#
# 'moomoo' is in that list for the same reason, confirmed the same way: after
# `uv sync --extra moomoo`, the very next plain `uv sync` reported
# "Uninstalled 3 packages: moomoo-api, pycryptodome, simplejson". Every .bat
# launcher in this repo goes through `uv run`, so an extra that is only ever
# installed by hand is an extra that is gone by the next double-click.
runtime = ["stock-ai[data,db,ai,dashboard,scheduler,tachibana,moomoo]"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "black>=24.4",
    "pre-commit>=3.7",
]

# `uv run` syncs the environment to the project's *default* requirements before
# it runs anything, and an extra is not a default. Installing one with
# `uv sync --extra ai` therefore lasts only until the next `uv run`, which
# quietly removes it again - observed live, mid-verification, as
# "No module named 'anthropic'" on a machine where it had worked minutes
# earlier and nothing but a git pull had happened.
#
# Naming the extras here makes them part of the default sync, so `uv run`
# maintains them instead of pruning them. The extras stay declared separately
# because a consumer installing this as a library still gets the small base.
[tool.uv]
# Both groups install on a bare `uv sync` and on every `uv run`.
default-groups = ["dev", "runtime"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stock_ai"]

# ---------------------------------------------------------------------------
# Tooling configuration
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, N: naming, UP: pyupgrade,
# B: bugbear, SIM: simplify, C4: comprehensions, D: pydocstyle.
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "C4", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-bugbear]
# typer's public API intentionally uses these as parameter defaults.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"main.py" = ["D"]
# Japanese docstrings end with "。", which D415 does not recognize as terminal.
"src/stock_ai/dashboard/app.py" = ["D415"]
"src/stock_ai/core/version.py" = ["D415"]
"src/stock_ai/data/jquants_fundamentals.py" = ["D415"]
"src/stock_ai/fundamental/growth.py" = ["D415"]
"src/stock_ai/data/tachibana.py" = ["D415"]
"src/stock_ai/data/tachibana_universe.py" = ["D415"]
"src/stock_ai/data/delisted.py" = ["D415"]
"src/stock_ai/data/jquants_exit.py" = ["D415"]
"src/stock_ai/data/jquants_bulk.py" = ["D415"]
"src/stock_ai/database/repository.py" = ["D415"]
"src/stock_ai/backtest/pead_census.py" = ["D415"]
"src/stock_ai/backtest/reversal_census.py" = ["D415"]
"src/stock_ai/backtest/reversal.py" = ["D415"]
"src/stock_ai/backtest/lowvol_census.py" = ["D415"]
"src/stock_ai/backtest/lowvol.py" = ["D415"]
"src/stock_ai/backtest/power.py" = ["D415"]
"src/stock_ai/backtest/cross_section.py" = ["D415"]
"src/stock_ai/backtest/factor_panel.py" = ["D415"]
"src/stock_ai/backtest/pead.py" = ["D415"]
"src/stock_ai/backtest/forecast_revision.py" = ["D415"]
"src/stock_ai/ir/edinet_financials.py" = ["D415"]
"src/stock_ai/ops/__init__.py" = ["D415"]
"src/stock_ai/ops/bridge.py" = ["D415"]
"src/stock_ai/ops/_payload.py" = ["D415"]
"src/stock_ai/dashboard/ops_page.py" = ["D415"]
"tools/*" = ["D415"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# **既定では網羅率の表を出さない。** 測りはする。
#
# `term-missing` は実行ごとに約100行を出す。CI では誰も読まず、会話に貼れば
# それだけで数千トークンになる。見たいときは
# `uv run pytest --cov-report=term-missing` と明示する。
addopts = "-ra --cov=stock_ai --cov-report="

[tool.coverage.run]
branch = true
source = ["stock_ai"]
