[project]
name = "stock-ai"
version = "0.1.0"
description = "AI-driven stock screening, backtesting, and trading system for JP/US markets."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "hayashida" }]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "rich>=13.7",
]

# Heavy, phase-scoped dependencies are opt-in extras so the base install
# stays small and fast. Install a phase's deps with e.g. `uv sync --extra data`.
[project.optional-dependencies]
data = ["pandas>=2.2", "numpy>=1.26", "httpx>=0.27", "yfinance>=0.2.40"]
db = ["sqlalchemy>=2.0", "alembic>=1.13"]
ai = ["anthropic>=0.30", "openai>=1.30", "google-generativeai>=0.7"]
backtest = ["vectorbt>=0.26"]
dashboard = ["streamlit>=1.36"]
broker = ["ib-insync>=0.9.86"]

[project.scripts]
stock-ai = "stock_ai.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "black>=24.4",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stock_ai"]

# ---------------------------------------------------------------------------
# Tooling configuration
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, N: naming, UP: pyupgrade,
# B: bugbear, SIM: simplify, C4: comprehensions, D: pydocstyle.
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "C4", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-bugbear]
# typer's public API intentionally uses these as parameter defaults.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"main.py" = ["D"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --cov=stock_ai --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["stock_ai"]
