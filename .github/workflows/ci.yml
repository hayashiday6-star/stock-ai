name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      # Plain 'uv sync', deliberately: default-groups installs exactly what a
      # user's machine gets, so CI and the desktop can no longer disagree about
      # what is present. '--all-extras' hid a real gap - 'schedule' was
      # imported and never declared, and CI stayed green only because vectorbt
      # happened to pull it in.
      - name: Install dependencies
        run: uv sync

      - name: Every module the code imports is actually declared
        run: |
          uv run python - <<'PY'
          import importlib.util, sys
          # Imported lazily inside functions, so nothing else would catch a
          # missing declaration until the command was run for real.
          required = [
              "anthropic", "openai", "google.generativeai",
              "pandas", "sqlalchemy", "streamlit", "schedule",
              "yfinance", "httpx", "openpyxl",
              # The moomoo client is imported inside moomoo-check, and only
              # ever on a machine with OpenD - so nothing else would notice
              # if a sync stopped installing it.
              "moomoo",
          ]
          missing = [m for m in required if importlib.util.find_spec(m) is None]
          if missing:
              sys.exit(f"not installed by a default sync: {missing}")
          print("all runtime imports satisfied")
          PY

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest -q
